
name: futurebuilder_example
description: Flutter example for local and network JSON data.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/users.json
    - assets/bulbasaur.webp
    - assets/ivysaur.webp
    - assets/venusaur.webp
    - assets/venusaurex.webp
    - assets/caterpie.webp
